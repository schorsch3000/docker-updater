name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
          sed -i "s/^VERSION=\"dev\"$/VERSION=\"$GITHUB_REF_NAME\"/" docker-updater
          grep -qx "VERSION=\"$GITHUB_REF_NAME\"" docker-updater
          sha256sum docker-updater > docker-updater.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" docker-updater docker-updater.sha256 --verify-tag --generate-notes
